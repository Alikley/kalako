<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- v1.0.0.7: favicon کالاکو — همان لوگوی سایت (ذره‌بین + K + برچسب قیمت) -->
  <!-- پس‌زمینه کرم برند تا روی تب‌های تیره و روشن هر دو دیده شود -->
  <rect width="100" height="100" rx="22" fill="#FDFBF7"/>

  <!-- دایره ذره‌بین -->
  <circle cx="42" cy="42" r="30" stroke="#1E293B" stroke-width="5" fill="none"/>

  <!-- دسته ذره‌بین -->
  <line x1="64" y1="64" x2="82" y2="82" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>

  <!-- حرف K — خط عمودی (Navy) -->
  <line x1="28" y1="22" x2="28" y2="62" stroke="#1E293B" stroke-width="6" stroke-linecap="round"/>

  <!-- حرف K — خط مورب بالا (Orange) -->
  <line x1="30" y1="38" x2="52" y2="22" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>

  <!-- حرف K — خط مورب پایین (Red → برچسب قیمت) -->
  <line x1="30" y1="42" x2="52" y2="62" stroke="#EF4444" stroke-width="6" stroke-linecap="round"/>

  <!-- سوراخ برچسب قیمت -->
  <circle cx="52" cy="56" r="2.5" fill="#FFFFFF"/>
</svg>
